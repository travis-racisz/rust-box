<!DOCTYPE html>
<html>
<head>
    <title>Rust Music Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <style>
        /* Catppuccin Mocha Theme Colors */
        :root {
            --rosewater: #f5e0dc;
            --flamingo: #f2cdcd;
            --pink: #f5c2e7;
            --mauve: #cba6f7;
            --red: #f38ba8;
            --maroon: #eba0ac;
            --peach: #fab387;
            --yellow: #f9e2af;
            --green: #a6e3a1;
            --teal: #94e2d5;
            --sky: #89dceb;
            --sapphire: #74c7ec;
            --blue: #89b4fa;
            --lavender: #b4befe;
            --text: #cdd6f4;
            --subtext1: #bac2de;
            --subtext0: #a6adc8;
            --overlay2: #9399b2;
            --overlay1: #7f849c;
            --overlay0: #6c7086;
            --surface2: #585b70;
            --surface1: #45475a;
            --surface0: #313244;
            --base: #1e1e2e;
            --mantle: #181825;
            --crust: #11111b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: var(--base);
            color: var(--text);
            margin: 0;
            padding: 0;
            transition: all 0.3s ease;
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
            border-bottom: 1px solid var(--surface0);
            margin-bottom: 20px;
        }

        .app-title {
            color: var(--lavender);
            font-size: 2rem;
            font-weight: 700;
        }

        .player-controls {
            display: flex;
            gap: 12px;
            padding: 16px;
            background-color: var(--surface0);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            justify-content: center;
        }

        .control-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--surface1);
            color: var(--text);
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-button:hover {
            background-color: var(--surface2);
            color: var(--lavender);
        }

        .control-button.play {
            background-color: var(--mauve);
            color: var(--base);
            width: 48px;
            height: 48px;
        }

        .control-button.play:hover {
            background-color: var(--lavender);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .library-container, .queue-container {
            background-color: var(--mantle);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            height: calc(100vh - 200px);
            overflow-y: auto;
        }

        .container-title {
            color: var(--lavender);
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--surface0);
            font-size: 1.25rem;
        }

        .breadcrumb {
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--subtext0);
        }

        .breadcrumb a {
            color: var(--blue);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .breadcrumb a:hover {
            color: var(--lavender);
            text-decoration: underline;
        }

        .breadcrumb-separator {
            color: var(--overlay0);
        }

        /* List styles */
        .list-container {
            list-style-type: none;
        }

        .list-item {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            background-color: var(--surface0);
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-item:hover {
            background-color: var(--surface1);
        }

        .list-item-content {
            flex: 1;
        }

        .list-item-controls {
            display: flex;
            gap: 8px;
        }

        .item-button {
            padding: 6px 10px;
            border-radius: 6px;
            background-color: transparent;
            color: var(--subtext0);
            border: 1px solid var(--surface1);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.8rem;
        }

        .item-button:hover {
            background-color: var(--surface1);
            color: var(--text);
        }

        .item-button.play {
            background-color: var(--green);
            color: var(--base);
            border: 1px solid var(--green);
        }

        .item-button.play:hover {
            background-color: var(--teal);
            border-color: var(--teal);
        }

        /* Queue item styles */
        .queue-item {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            background-color: var(--surface0);
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .queue-item.playing {
            background-color: var(--surface1);
            border-left: 4px solid var(--mauve);
        }

        .queue-item-info {
            flex: 1;
        }

        .queue-item-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .queue-item-details {
            font-size: 0.85rem;
            color: var(--subtext0);
        }

        .queue-item-controls {
            display: flex;
            gap: 8px;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background-color: var(--mantle);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background-color: var(--surface1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: var(--surface2);
        }

        /* Now playing display */
        .now-playing {
            padding: 16px;
            background-color: var(--surface0);
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .now-playing-cover {
            width: 64px;
            height: 64px;
            background-color: var(--surface1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .now-playing-cover i {
            font-size: 24px;
            color: var(--lavender);
        }

        .now-playing-info {
            flex: 1;
        }

        .now-playing-title {
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .now-playing-artist {
            font-size: 0.9rem;
            color: var(--subtext0);
        }

        /* Empty states */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--overlay0);
            text-align: center;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            color: var(--surface1);
        }

        .empty-state-text {
            font-size: 0.9rem;
        }

        /* Media Queries */
        @media screen and (max-width: 1024px) {
            .app-container {
                padding: 16px;
            }
            
            .library-container, .queue-container {
                height: calc(100vh - 180px);
            }
        }
        
        @media screen and (max-width: 768px) {
            .app-title {
                font-size: 1.5rem;
            }
            
            .main-content {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            
            .library-container, .queue-container {
                height: auto;
                max-height: 400px;
            }
            
            .now-playing {
                padding: 12px;
            }
            
            .player-controls {
                padding: 12px;
            }
            
            .control-button {
                width: 36px;
                height: 36px;
            }
            
            .control-button.play {
                width: 42px;
                height: 42px;
            }
        }
        
        @media screen and (max-width: 480px) {
            .app-container {
                padding: 12px;
            }
            
            .app-title {
                font-size: 1.25rem;
            }
            
            .player-controls {
                gap: 8px;
                padding: 10px;
            }
            
            .control-button {
                width: 32px;
                height: 32px;
            }
            
            .control-button.play {
                width: 38px;
                height: 38px;
            }
            
            .list-item {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .list-item-controls {
                margin-top: 8px;
                width: 100%;
                justify-content: flex-end;
            }
            
            .now-playing-cover {
                width: 48px;
                height: 48px;
            }
            
            .now-playing-cover i {
                font-size: 18px;
            }
            
            .now-playing-title {
                font-size: 0.9rem;
            }
            
            .now-playing-artist {
                font-size: 0.8rem;
            }
            
            .queue-item {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .queue-item-controls {
                margin-top: 8px;
                width: 100%;
                justify-content: flex-end;
            }
            
            .breadcrumb {
                flex-wrap: wrap;
            }
        }
        
        /* For very small screens */
        @media screen and (max-width: 320px) {
            .app-title {
                font-size: 1.1rem;
            }
            
            .container-title {
                font-size: 1rem;
            }
            
            .control-button {
                width: 28px;
                height: 28px;
            }
            
            .control-button.play {
                width: 34px;
                height: 34px;
            }
            
            .item-button {
                padding: 4px 8px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1 class="app-title">Catppuccin Music Player</h1>
            
        </header>

        <div class="now-playing" id="now-playing">
            <div class="now-playing-cover">
                <i class="fas fa-music"></i>
            </div>
            <div class="now-playing-info">
                <div class="now-playing-title">Nothing playing</div>
                <div class="now-playing-artist">Select a song to start playback</div>
            </div>
        </div>

        <div class="player-controls">
            <button id="previous-button" class="control-button">
                <i class="fas fa-step-backward"></i>
            </button>
            <button id="play-button" class="control-button play">
                <i class="fas fa-play"></i>
            </button>
            <button id="pause-button" class="control-button">
                <i class="fas fa-pause"></i>
            </button>
            <button id="stop-button" class="control-button">
                <i class="fas fa-stop"></i>
            </button>
            <button id="next-button" class="control-button">
                <i class="fas fa-step-forward"></i>
            </button>
        </div>

        <div class="main-content">
            <div class="library-container">
                <h2 class="container-title">Music Library</h2>
                <div class="breadcrumb" id="breadcrumb">
                    <a href="#" id="home-link">Home</a>
                </div>
                <div id="library-content"></div>
            </div>

            <div class="queue-container">
                <h2 class="container-title">Queue</h2>
                <div id="queue-content"></div>
            </div>
        </div>
    </div>

    <script>
        // State tracking variables
        let isPlaying = false;
        let currentArtist = null;
        let currentAlbum = null;
        
        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            // Set up event listeners for player controls
            document.getElementById('play-button').addEventListener('click', playMusic);
            document.getElementById('pause-button').addEventListener('click', pauseMusic);
            document.getElementById('stop-button').addEventListener('click', stopMusic);
            document.getElementById('next-button').addEventListener('click', nextSong);
            document.getElementById('previous-button').addEventListener('click', previousSong);
            
            // No need to set up home link event listener here - it's handled in updateBreadcrumb
            // which gets called by loadLibrary
            
            // Initial library load
            loadLibrary();
            loadQueue();
            
            // Poll queue status periodically
            setInterval(loadQueue, 5000);
        });
        
        // Player control functions
        function playMusic() {
            const currentIndex = getCurrentQueueIndex();
            
            if (currentIndex !== null) {
                playQueueIndex(currentIndex);
            } else {
                // No song is currently in the queue or playing
                console.log('No song in queue to play');
            }
        }
        
        function pauseMusic() {
            fetch('/pause')
                .then(() => {
                    isPlaying = false;
                    updatePlayPauseButton();
                });
        }
        
        function stopMusic() {
            fetch('/stop')
                .then(() => {
                    isPlaying = false;
                    updatePlayPauseButton();
                });
        }
        
        function nextSong() {
            fetch('/next')
                .then(() => {
                    isPlaying = true;
                    updatePlayPauseButton();
                    setTimeout(loadQueue, 500);
                });
        }
        
        function previousSong() {
            fetch('/previous')
                .then(() => {
                    isPlaying = true;
                    updatePlayPauseButton();
                    setTimeout(loadQueue, 500);
                });
        }
        
        // Helper to update the play/pause button
        function updatePlayPauseButton() {
            const playButton = document.getElementById('play-button');
            playButton.style.display = isPlaying ? 'none' : 'flex';
            
            const pauseButton = document.getElementById('pause-button');
            pauseButton.style.display = isPlaying ? 'flex' : 'none';
        }
        
        // Helper to get the currently playing queue index
        function getCurrentQueueIndex() {
            const playingItem = document.querySelector('.queue-item.playing');
            return playingItem ? parseInt(playingItem.dataset.index) : null;
        }
        
        // Helper to update the now playing display
        function updateNowPlaying(song) {
            const nowPlaying = document.getElementById('now-playing');
            const nowPlayingTitle = nowPlaying.querySelector('.now-playing-title');
            const nowPlayingArtist = nowPlaying.querySelector('.now-playing-artist');
            
            if (song) {
                nowPlayingTitle.textContent = song.title;
                nowPlayingArtist.textContent = `${song.artist} - ${song.album}`;
            } else {
                nowPlayingTitle.textContent = 'Nothing playing';
                nowPlayingArtist.textContent = 'Select a song to start playback';
            }
        }
        
        // Load the music library
        function loadLibrary() {
            // Clear current navigation state
            currentArtist = null;
            currentAlbum = null;
            
            // Update breadcrumb first
            updateBreadcrumb();
            
            // Add a loading indicator
            const libraryContent = document.getElementById('library-content');
            libraryContent.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <div class="empty-state-text">Loading library...</div>
                </div>
            `;
            
            // Fetch library data with error handling
            fetch('/get_library')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(artists => {
                    if (!Array.isArray(artists) || artists.length === 0) {
                        libraryContent.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-music"></i>
                                <div class="empty-state-text">No artists found in your library</div>
                            </div>
                        `;
                        return;
                    }
                    
                    // Create artist list
                    const ul = document.createElement('ul');
                    ul.className = 'list-container';
                    
                    artists.forEach(artist => {
                        const li = document.createElement('li');
                        li.className = 'list-item';
                        
                        const content = document.createElement('div');
                        content.className = 'list-item-content';
                        content.textContent = artist;
                        
                        li.appendChild(content);
                        
                        // Add click event directly to the list item
                        li.addEventListener('click', function() {
                            loadArtist(artist);
                        });
                        
                        ul.appendChild(li);
                    });
                    
                    // Clear and append the new content
                    libraryContent.innerHTML = '';
                    libraryContent.appendChild(ul);
                })
                .catch(error => {
                    console.error('Error loading library:', error);
                    libraryContent.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <div class="empty-state-text">Error loading library. Please try again.</div>
                        </div>
                    `;
                });
        }
        
        // Load artist albums
        function loadArtist(artist) {
            if (!artist) {
                console.error('Artist name is missing');
                return;
            }
            
            // Update navigation state
            currentArtist = artist.artist;
            currentAlbum = null;
            
            // Update breadcrumb
            updateBreadcrumb();
            
            // Add loading indicator
            const libraryContent = document.getElementById('library-content');
            libraryContent.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <div class="empty-state-text">Loading albums for ${artist}...</div>
                </div>
            `;
            
            // Fetch artist albums with error handling
            fetch(`/${encodeURIComponent(artist)}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(albums => {
                    if (!Array.isArray(albums) || albums.length === 0) {
                        libraryContent.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-compact-disc"></i>
                                <div class="empty-state-text">No albums found for ${artist.artist}</div>
                            </div>
                        `;
                        return;
                    }
                    
                    // Create album list
                    const ul = document.createElement('ul');
                    ul.className = 'list-container';
                    
                    albums.forEach(album => {
                        console.log(album)
                        const ca = document.createElement('img')
                ca.src = `../assets/music/${artist}/${album.title}/${album.cover_art_path}`
                          ca.style.width = "48px";
                         ca.style.height = "48px";
                         ca.style.objectFit = "cover";
                         ca.style.borderRadius = "8px";
                         ca.style.marginRight = "12px";

                        const li = document.createElement('li');
                        li.className = 'list-item';
                        
                        const content = document.createElement('div');
                        content.className = 'list-item-content';
                        content.textContent = album.title;
                        
                        li.appendChild(content);
                        li.appendChild(ca);
                        
                        // Add click event directly to the list item
                        li.addEventListener('click', function() {
                            loadAlbum(artist, album.title);
                        });
                        
                        ul.appendChild(li);
                    });
                    
                    // Clear and append the new content
                    libraryContent.innerHTML = '';
                    libraryContent.appendChild(ul);
                })
                .catch(error => {
                    console.error('Error loading albums:', error);
                    libraryContent.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <div class="empty-state-text">Error loading albums for ${artist}. Please try again.</div>
                        </div>
                    `;
                });
        }
        
        // Load album songs
        function loadAlbum(artist, album) {
            if (!artist || !album) {
                console.error('Artist or album name is missing');
                return;
            }
            
            // Update navigation state
            currentArtist = artist;
            currentAlbum = album;
            
            // Update breadcrumb
            updateBreadcrumb();
            
            // Add loading indicator
            const libraryContent = document.getElementById('library-content');
            libraryContent.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <div class="empty-state-text">Loading songs from ${album}...</div>
                </div>
            `;
            
            // Fetch album songs with error handling
            fetch(`/${encodeURIComponent(artist)}/${encodeURIComponent(album)}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(songs => {
                    if (!Array.isArray(songs) || songs.length === 0) {
                        libraryContent.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-file-audio"></i>
                                <div class="empty-state-text">No songs found in ${album}</div>
                            </div>
                        `;
                        return;
                    }
                    
                    // Create song list
                    const ul = document.createElement('ul');
                    ul.className = 'list-container';
                    
                    songs.forEach(song => {
                // add cover art in song.cover_art_path
                        const ca = document.createElement('img')
                ca.src = `../assets/music/${artist}/${album}/${song.cover_art_path}`
                          ca.style.width = "48px";
                         ca.style.height = "48px";
                         ca.style.objectFit = "cover";
                         ca.style.borderRadius = "8px";
                         ca.style.marginRight = "12px";
                        console.log(ca.src)
                        const li = document.createElement('li');
                        li.className = 'list-item';
                        
                        const content = document.createElement('div');
                        content.className = 'list-item-content';
                        content.textContent = song.title;
                        
                        const controls = document.createElement('div');
                        controls.className = 'list-item-controls';
                        
                        const playButton = document.createElement('button');
                        playButton.className = 'item-button play';
                        playButton.innerHTML = '<i class="fas fa-play"></i> Play';
                        
                        // Use function declaration for consistency
                        playButton.addEventListener('click', function(e) {
                            e.stopPropagation();
                            playSong(artist, album, song);
                            
                            // Show notification (moved from addToQueue)
                            const notification = document.createElement('div');
                            notification.style.position = 'fixed';
                            notification.style.bottom = '20px';
                            notification.style.right = '20px';
                            notification.style.backgroundColor = 'var(--green)';
                            notification.style.color = 'var(--base)';
                            notification.style.padding = '10px 16px';
                            notification.style.borderRadius = '8px';
                            notification.style.boxShadow = '0 4px 6px rgba(0, 0, 0, 0.1)';
                            notification.style.zIndex = '1000';
                            notification.innerHTML = `<i class="fas fa-play"></i> Adding: ${song.title} to queue`;
                            
                            document.body.appendChild(notification);
                            setTimeout(() => {
                                notification.style.opacity = '0';
                                notification.style.transition = 'opacity 0.5s ease';
                                setTimeout(() => {
                                    document.body.removeChild(notification);
                                }, 500);
                            }, 2000);
                        });
                        
                        controls.appendChild(playButton);
                        li.appendChild(ca);
                        li.appendChild(content);
                        li.appendChild(controls);
                        
                        ul.appendChild(li);
                    });
                    
                    // Clear and append the new content
                    libraryContent.innerHTML = '';
                    libraryContent.appendChild(ul);
                })
                .catch(error => {
                    console.error('Error loading songs:', error);
                    libraryContent.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <div class="empty-state-text">Error loading songs from ${album}. Please try again.</div>
                        </div>
                    `;
                })
          
        }
        
        // Play a song immediately
        function playSong(artist, album, song) {
            // Show loading in the now playing area
            updateNowPlaying({
                title: `Loading: ${song.title}`,
                artist: artist,
                album: album
            });
            
            fetch(`/play/${encodeURIComponent(artist)}/${encodeURIComponent(album)}/${encodeURIComponent(song.title)}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to play song');
                    }
                    isPlaying = true;
                    updatePlayPauseButton();
                    updateNowPlaying({
                        title: song.title,
                        artist: artist,
                        album: album
                    });
                    setTimeout(loadQueue, 500);
                })
                .catch(error => {
                    console.error('Error playing song:', error);
                    // Show error in now playing
                    updateNowPlaying({
                        title: 'Error playing song',
                        artist: 'Please try again',
                        album: ''
                    });
                });
        }
        
        // Function removed since we're no longer using the Queue button
        // Keeping the function name and basic structure in case it's called elsewhere
        function addToQueue(artist, album, song) {
            console.log('addToQueue functionality has been removed');
        
        }
        
        // Play a specific song in the queue
        function playQueueIndex(index) {
            fetch(`/play_queue_index/${index}`)
                .then(() => {
                    isPlaying = true;
                    updatePlayPauseButton();
                    setTimeout(loadQueue, 500);
                });
        }
        
        // Load the current queue
        function loadQueue() {
            fetch('/queue')
                .then(response => response.json())
                .then(queueStatus => {
                    const queueContent = document.getElementById('queue-content');
                    
                    console.log(queueStatus)
                    if (queueStatus.queue.length === 0) {
                        queueContent.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-list"></i>
                                <div class="empty-state-text">Your queue is empty</div>
                            </div>
                        `;
                        return;
                    }
                    
                    queueContent.innerHTML = '';
                    
                    queueStatus.queue.forEach((song, index) => {
                        const queueItem = document.createElement('div');
                        queueItem.className = 'queue-item';
                        queueItem.dataset.index = index;
                        
                        if (index === queueStatus.current_index) {
                            queueItem.classList.add('playing');
                            
                            // Update now playing
                            updateNowPlaying(song);
                            
                            // Update playing state
                            isPlaying = queueStatus.is_playing;
                            updatePlayPauseButton();
                        }
                        
                        const songInfo = document.createElement('div');
                        songInfo.className = 'queue-item-info';
                        
                        const songTitle = document.createElement('div');
                        songTitle.className = 'queue-item-title';
                        songTitle.textContent = song.title;
                        
                        const songDetails = document.createElement('div');
                        songDetails.className = 'queue-item-details';
                        songDetails.textContent = `${song.artist} - ${song.album}`;
                        
                        songInfo.appendChild(songTitle);
                        songInfo.appendChild(songDetails);
                        
                        const controls = document.createElement('div');
                        controls.className = 'queue-item-controls';
                        
                        const playButton = document.createElement('button');
                        playButton.className = 'item-button play';
                        playButton.innerHTML = '<i class="fas fa-play"></i>';
                        playButton.addEventListener('click', () => playQueueIndex(index));
                        
                        controls.appendChild(playButton);
                        queueItem.appendChild(songInfo);
                        queueItem.appendChild(controls);
                        queueContent.appendChild(queueItem);
                    });
                });
        }
        
        // Update breadcrumb navigation
        function updateBreadcrumb() {
            const breadcrumb = document.getElementById('breadcrumb');
            
            // Create elements properly instead of using innerHTML
            // This helps prevent event listener issues
            breadcrumb.innerHTML = '';
            
            // Home link
            const homeLink = document.createElement('a');
            homeLink.href = "#";
            homeLink.id = "home-link";
            homeLink.textContent = "Home";
            homeLink.addEventListener('click', function(e) {
                e.preventDefault();
                loadLibrary();
            });
            breadcrumb.appendChild(homeLink);
            
            // Add artist link if we have one
            if (currentArtist) {
                const separator = document.createElement('span');
                separator.className = "breadcrumb-separator";
                separator.textContent = "/";
                breadcrumb.appendChild(separator);
                
                const artistLink = document.createElement('a');
                artistLink.href = "#";
                artistLink.id = "artist-link";
                artistLink.textContent = currentArtist;
                artistLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    loadArtist(currentArtist);
                });
                breadcrumb.appendChild(artistLink);
            }
            
            // Add album link if we have one
            if (currentAlbum) {
                const separator = document.createElement('span');
                separator.className = "breadcrumb-separator";
                separator.textContent = "/";
                breadcrumb.appendChild(separator);
                
                const albumLink = document.createElement('a');
                albumLink.href = "#";
                albumLink.id = "album-link";
                albumLink.textContent = currentAlbum;
                albumLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    loadAlbum(currentArtist, currentAlbum);
                });
                breadcrumb.appendChild(albumLink);
            }
        }
    </script>
